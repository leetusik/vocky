# vocky.conf — vocky.hi2vi.com, the vocky feedback-capture SaaS site.
#
# WHAT THIS IS: the nginx vhost fronting the box containers (compose.prod.yml) on
# the OCI box. It terminates the origin TLS Cloudflare connects to and routes by
# path over the external `changple_shared_network`. TWO upstreams (P6.S5):
#   * the FastAPI control plane + capture API + IN-APP MCP —
#     `/api/*`, `/auth/*`, `/app/*`, `/mcp`, `= /healthz` -> `vocky-api:8000`.
#     `/mcp` is a Starlette Mount INSIDE this same container (FastMCP
#     Streamable-HTTP), so there is NO separate mcp container — the edge routes
#     /mcp to vocky-api, not to a `vocky-mcp` upstream.
#   * the Next.js app — the TWO BFF prefixes `/api/auth/*` and `/api/app/*` (both
#     MORE SPECIFIC than `/api/`, so they win the longest-prefix match and reach
#     the web app) plus everything else (`/` landing, `/dashboard`, `/feedback`,
#     `/projects`, `/login`, `/signup`, all Next assets, ...) -> `vocky-web:3000`.
#   * `/admin/*` is NOT exposed at the edge (see the `location /admin/` 404 below):
#     the admin REST surface (`/admin/api/*`, admin-bearer-gated) is kept internal;
#     SaaS operations reach the server via `/app/*`, not through the public edge.
# Modeled on the sibling edge's proven knowledge.conf.
#
# WHERE IT LANDS: /home/opc/edge/conf.d/vocky.conf on the box — the dedicated edge
# (compose project `edge` at /home/opc/edge, container `edge-nginx`, owner of :80 +
# :443). conf.d/ and certs/ are READ-ONLY HOST BIND MOUNTS, so the edge's config is
# declarative host state: applying a change is a file drop plus a reload.
#
#     scp deploy/vocky.conf oracle-cloud:/home/opc/edge/conf.d/vocky.conf
#     ssh oracle-cloud 'cd /home/opc/edge && ./validate.sh && ./deploy.sh'
#
# ./deploy.sh is the edge's own apply path: a hard `nginx -t` gate inside the
# RUNNING container, then a graceful `nginx -s reload` — and never a recreate
# (recreating drops the runtime network attachment; that cascade is exactly what
# the dedicated edge was built to remove). A failed `nginx -t` reloads nothing, so
# the edge keeps serving its last known-good config. ./validate.sh is the optional
# local pre-gate (dummy certs + compose config + throwaway-container nginx -t over
# the whole tree). NEVER `docker cp` into edge-nginx; never `docker compose
# up`/`restart` the edge.
#
# HOUSE RULES — the conf.d/ tree is tested and reloaded AS A UNIT, so breaking one
# of these breaks EVERY co-tenant site on the edge (changple5, knowledge, hi2vi),
# not just this one:
#   * NEVER declare this the default server. 00-default.conf owns the :80 and :443
#     catch-alls (unknown Host -> 444). This vhost routes by Host/SNI only.
#   * NO IPv6 listen. No sibling conf binds v6, so an IPv6 bind here would silently
#     make THIS vhost the default server for all v6 traffic.
#   * NO rate-limit zone (see the deliberate note directly below).
#   * ALL zone / upstream NAMES are GLOBAL across the whole conf.d/ tree, so a
#     duplicate name fails `nginx -t` for every site. This file declares NO named
#     `upstream {}` block (it uses variable proxy_pass instead) and introduces no
#     shared global name, so nothing here can collide with a sibling vhost.
#
# --- NO rate-limit zone here — deliberate ------------------------------------
# A rate-limit zone lives in the http context and its zone NAME is GLOBAL across
# the whole conf.d/ tree. hi2vi.conf declares the tree's only one; a duplicate name
# is a hard `nginx -t` failure that would block the reload for EVERY site on the
# edge. So there is NO rate-limit zone here, ever.
#
# /api/* needs none: every capture / project-read / project-manage call is
# credential-gated (per-project `vk_` keys) behind Cloudflare. But `/auth/*` (the
# account login/signup surface — an UNAUTHENTICATED password grant + open signup)
# is also published to vocky-api below. Unlike the sibling knowledge (which
# throttles its /auth/* with an in-process per-IP limiter in the app), vocky has NO
# server-side limiter on /auth/* today, and the shared edge forbids a limit zone
# here — so at launch /auth/* is UNTHROTTLED at the origin, relying on Cloudflare
# in front of it. OPEN GAP: add a Cloudflare rate rule and/or an in-process /auth
# limiter (tracked as a deferred job; see the phase Open Questions). The Cloudflare
# real-IP restore below is what would let any future limiter — and the access logs
# — key off real visitors, not the Cloudflare edge.

# =====================================================================
# :80 — redirect everything to HTTPS. A server-level `return` executes before
# location matching, so nothing else is needed here.
# =====================================================================
server {
    listen 80;
    server_name vocky.hi2vi.com;

    return 301 https://$host$request_uri;
}

# =====================================================================
# :443 — the vocky vhost (FastAPI control plane + Next.js app + in-app MCP).
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name vocky.hi2vi.com;

    # TLS: the edge's Cloudflare Origin CA cert for hi2vi. Its SANs are
    # `DNS:*.hi2vi.com, DNS:hi2vi.com`, so the WILDCARD ALREADY COVERS
    # vocky.hi2vi.com — there is nothing to provision and no per-host cert.
    # Re-check with:
    #   openssl x509 -in /home/opc/edge/certs/hi2vi.crt -noout -text \
    #     | grep -A1 'Subject Alternative Name'
    ssl_certificate     /etc/nginx/certs/hi2vi.crt;
    ssl_certificate_key /etc/nginx/certs/hi2vi.key;

    # Docker DNS re-resolution (LOAD-BEARING): the upstreams are the vocky-api and
    # vocky-web CONTAINERS, whose IPs change every time they are recreated (a
    # rebuild, a box reboot). 127.0.0.11 (Docker's embedded DNS) + a VARIABLE in
    # proxy_pass forces nginx to re-resolve at request time honoring valid=30s, so
    # an api/web restart self-heals. Without this, nginx resolves the name ONCE at
    # load and proxies to a dead IP forever.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $vocky_api vocky-api;
    set $vocky_web vocky-web;

    # --- Cloudflare real-IP restore -----------------------------------------
    # Rewrites $remote_addr to the true client IP from CF-Connecting-IP, so access
    # logs (and any future limiter) key off real visitors, not the Cloudflare edge.
    # Ranges as published at https://www.cloudflare.com/ips/ — the same list the
    # sibling confs carry; refresh them together, never one file alone.
    # IPv4:
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6:
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # HSTS — house style: short max-age, NO includeSubDomains, NO preload. Bump
    # only as a deliberate post-cutover decision, once HTTPS is confirmed healthy.
    add_header Strict-Transport-Security "max-age=300" always;

    # ADDITIVE upgrade-insecure-requests CSP — this COMPOSES with (does NOT replace)
    # the app's own full Content-Security-Policy emitted by the Next app in
    # production (web/next.config.ts, P6.S3). Browsers merge multiple CSP headers by
    # intersection, so this only adds the upgrade directive at the edge; nginx
    # otherwise passes the app's CSP and its four other security headers through
    # untouched (do NOT re-declare or strip them here).
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # Feedback attachments upload ONE-PER-REQUEST via POST /api/feedback/attachments
    # (each <= 5 MiB; the capture references them by id — it is NOT a 10x5 MiB batch
    # in one body), so 12m is comfortable headroom over the per-file ceiling.
    client_max_body_size 12m;

    # --- Shared proxy headers — HOISTED to server level ----------------------
    # HEADER-INHERITANCE FOOTGUN: nginx inherits proxy_set_header directives into a
    # `location` ONLY IF that location sets NONE of its own — the first
    # proxy_set_header inside a location drops the ENTIRE inherited set. With several
    # locations across two upstreams, keeping the shared headers here (and letting
    # every location set NONE) is what guarantees BOTH the api and the web upstreams
    # get the full Host / real-IP / forwarded set + the HTTP/1.1 keep-alive scrub.
    # EVERY location below sets NONE of its own proxy_set_header / add_header.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --- ROUTING — most-specific match wins ----------------------------------
    # nginx picks the LONGEST matching prefix (order-independent; there are no regex
    # locations here), so the map is:
    #   = /healthz, /api/, /auth/, /app/, /mcp   -> vocky-api  (FastAPI + in-app MCP)
    #   /api/auth/, /api/app/                     -> vocky-web  (the two Next BFF prefixes; beat /api/)
    #   /admin/                                   -> return 404 (admin REST kept internal)
    #   /  (everything else)                      -> vocky-web  (the Next app + assets)
    #
    # The two BFF prefixes are MORE SPECIFIC than /api/, so the Next app's own
    # server-side routes (/api/auth/* sign-in/out/refresh; /api/app/* the attachment
    # download proxy) go to the web app while every OTHER /api/* call still reaches
    # FastAPI — FastAPI has no /api/auth/* or /api/app/* route, so nothing is
    # shadowed. /api/project/* is NOT under /api/app/, so it correctly stays on the
    # api. The `/` catch-all serves the Next app (landing + authed UI + its assets).
    #
    # Fast routes use a 5s connect + 60s read timeout — vocky has no slow
    # git-push-style writes, so requests are quick; Cloudflare itself gives up at
    # ~100s (a 524) regardless of what nginx allows. /mcp is the one exception (SSE).

    location /api/ {
        # Variable form forces request-time DNS re-resolution (resolver note above).
        # vk_ capture ingest + project read/manage. NO per-location header (footgun).
        proxy_pass http://$vocky_api:8000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The Next.js BFF's auth routes (sign-in / sign-out / signup). MORE SPECIFIC
    # than /api/, so it wins the longest-prefix match and reaches the web app —
    # FastAPI has no /api/auth/* route, so nothing is shadowed. Variable proxy_pass
    # for request-time DNS re-resolution; NO per-location proxy_set_header (footgun).
    location /api/auth/ {
        proxy_pass http://$vocky_web:3000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The Next.js BFF's attachment-download proxy
    # (/api/app/feedback/{id}/attachments/{id}). Also MORE SPECIFIC than /api/, so
    # it reaches the web app; FastAPI has no /api/app/* route. Variable proxy_pass;
    # NO per-location proxy_set_header (footgun).
    location /api/app/ {
        proxy_pass http://$vocky_web:3000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Account auth (CLI + server-to-server): login / logout / me / signup on
    # vocky-api. An UNAUTHENTICATED grant + open signup — see the "NO rate-limit
    # zone" deliberate note at the top (no origin throttle today; Cloudflare in
    # front). Mirrors /api/ — same upstream (variable form), same timeouts, and
    # deliberately NO per-location proxy_set_header (footgun).
    location /auth/ {
        proxy_pass http://$vocky_api:8000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Session control plane (tenant / projects / usage / feedback management) on
    # vocky-api. Same upstream + timeouts; NO per-location proxy_set_header (footgun).
    location /app/ {
        proxy_pass http://$vocky_api:8000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://$vocky_api:8000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The in-app MCP endpoint (FastMCP Streamable-HTTP, mounted at /mcp INSIDE
    # vocky-api — there is NO separate mcp container). MORE SPECIFIC than `/` and
    # disjoint from `/api/`, so longest-prefix routing sends /mcp here and everything
    # else stays put. Variable proxy_pass for request-time DNS re-resolution.
    # Deliberately NO per-location proxy_set_header — it inherits the FULL
    # server-level set (Host / real-IP / X-Forwarded-* AND proxy_http_version 1.1 +
    # `Connection ""`; the footgun above). That inherited HTTP/1.1 keep-alive is
    # REQUIRED for the streamed Streamable-HTTP/SSE response.
    #
    # SSE-SAFE: proxy_buffering off streams the response straight through (buffering
    # would delay/break the stream), and long read/send timeouts tolerate a slow
    # stream. NB: Cloudflare still caps an origin response at ~100s (a 524)
    # regardless, so each tool call must be a bounded per-call proxy well under that
    # ceiling; these long timeouts just keep a single streamed call from being cut on
    # the origin side. NO rate-limit zone here (the global-name footgun; /mcp is
    # gated per tool call upstream anyway).
    location /mcp {
        proxy_pass http://$vocky_api:8000;

        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /admin/* — NOT exposed at the edge. The only routes under this prefix are the
    # admin REST API (/admin/api/*, admin-bearer-gated); api.md says to protect or
    # avoid exposing it, so the whole prefix returns 404 at the edge and the surface
    # stays internal-only. (The packaged Admin Web UI was removed in P6.S1; there is
    # no bare /admin route to serve.) SaaS ops reach the server via /app/*.
    location /admin/ {
        return 404;
    }

    location / {
        # The Next.js app (vocky-web): the public landing at `/`, the authenticated
        # UI (/dashboard, /feedback, /projects), /login, /signup, and all Next
        # assets. No URI part after the port => the original request URI passes
        # through unchanged (and the variable form is what makes re-resolution work).
        proxy_pass http://$vocky_web:3000;
    }
}
