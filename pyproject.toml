[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vocky"
version = "0.1.0"
description = "Feedback MCP for agents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Vocky" }]
dependencies = [
  "alembic>=1.18.4,<2.0.0",
  "greenlet>=3.2.4,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
  "mcp[cli]>=1.27.0,<2.0.0",
  "pydantic-settings>=2.11.0,<3.0.0",
  "psycopg[binary]>=3.2.12,<4.0.0",
  "redis>=5.3.1,<6.0.0",
  "sqlalchemy>=2.0.49,<3.0.0",
  "starlette>=0.52.1,<1.0.0",
  "uvicorn[standard]>=0.38.0,<1.0.0",
  "python-multipart>=0.0.26",
]

[dependency-groups]
dev = [
  "fakeredis>=2.31.1,<3.0.0",
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
]

[project.scripts]
vocky = "vocky.main:main"
vocky-smoke = "vocky.smoke:main"
vocky-worker = "vocky.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vocky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
