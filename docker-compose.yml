services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${REDIS_PUBLISH_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocky}
      POSTGRES_USER: ${POSTGRES_USER:-vocky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocky}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PUBLISH_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocky}:${POSTGRES_PASSWORD:-vocky}@postgres:5432/${POSTGRES_DB:-vocky}
      REDIS_URL: redis://redis:6379/0
      VOCKY_HOST: 0.0.0.0
      VOCKY_PORT: 8000
      VOCKY_LOG_LEVEL: ${VOCKY_LOG_LEVEL:-INFO}
      VOCKY_MCP_ALLOWED_HOSTS: ${VOCKY_MCP_ALLOWED_HOSTS:-}
      VOCKY_MCP_ALLOWED_ORIGINS: ${VOCKY_MCP_ALLOWED_ORIGINS:-}
      VOCKY_MCP_AUTH_TOKEN: ${VOCKY_MCP_AUTH_TOKEN:-}
      VOCKY_ADMIN_AUTH_TOKEN: ${VOCKY_ADMIN_AUTH_TOKEN:-}
    command: ["sh", "-lc", "uv sync --frozen && uv run vocky"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${VOCKY_PUBLISH_HOST:-127.0.0.1}:${VOCKY_PORT:-8000}:8000"

  worker:
    build:
      context: .
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vocky}:${POSTGRES_PASSWORD:-vocky}@postgres:5432/${POSTGRES_DB:-vocky}
      REDIS_URL: redis://redis:6379/0
      VOCKY_LOG_LEVEL: ${VOCKY_LOG_LEVEL:-INFO}
    command: ["sh", "-lc", "uv sync --frozen && uv run vocky-worker"]

volumes:
  postgres-data:
  redis-data:
